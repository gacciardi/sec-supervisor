<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEC Distribución - Recrear recorrido</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>body{background:#f3f6fa;color:#17233b;font-family:Arial,sans-serif}.wrap{max-width:1450px;margin:20px auto;padding:0 16px}.panel{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin:14px 0}.filters,.stats,.controls{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.filters label{display:grid;gap:5px}input,select,button{padding:10px;border:1px solid #cbd5e1;border-radius:8px}button{background:#071b3a;color:white;cursor:pointer}button:disabled{opacity:.5}#mapa{height:550px;border-radius:10px}#barra{flex:1;min-width:180px}#estado{min-height:24px}.stat{padding:12px;background:#f1f5f9;border-radius:10px}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:8px;border-bottom:1px solid #e5e7eb}@media(max-width:700px){#mapa{height:400px}}</style></head>
<body><header class="header-sec"><img src="../assets/logo-rebesa.jpg" class="logo-rebesa" alt="Empresa"><div><h1>SEC Distribución · Recrear recorrido</h1><p id="empresa">Empresa activa</p></div></header>
<div class="wrap"><p><a href="index.html">← Volver a Distribución</a></p>
<div class="panel filters"><label>Fecha<input id="fecha" type="date"></label><label>Conductor<select id="conductor"></select></label><button id="consultar">Consultar recorrido</button></div>
<div id="estado" role="status"></div><div class="panel stats" id="resumen"></div>
<div class="panel"><div class="controls"><button id="inicio">⏮ Inicio</button><button id="play">▶ Reproducir</button><input id="barra" type="range" min="0" max="1000" value="0" aria-label="Posición en el recorrido"><strong id="hora">--:--:--</strong><label>Velocidad <select id="vel"><option>1</option><option>5</option><option selected>10</option><option>20</option><option>60</option></select>x</label><button id="completo">Vista completa</button></div><p id="reproEstado"></p><div id="mapa"></div></div>
<div class="panel"><h3>Entregas y visitas</h3><div style="overflow:auto"><table><thead><tr><th>Hora</th><th>Cliente</th><th>Resultado</th><th>Permanencia</th></tr></thead><tbody id="visitas"></tbody></table></div></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
'use strict';
const API='https://sec-backend-gg4j.onrender.com/distribucion',token=sessionStorage.getItem('sec-distribucion-token');
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let mapa,base,track,visitLayer,marker,datos=[],visitas=[],cortes=[],start=0,end=0,at=0,playing=false,frame=null,last=0;
const dateFmt=t=>new Date(t).toLocaleTimeString('es-AR'),ms=x=>new Date(x).getTime();
async function api(path){const r=await fetch(API+path,{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error(r.status===401?'Sesión vencida. Volvé a ingresar.':'Error de consulta ('+r.status+')');return r.json()}
function stop(){playing=false;if(frame!==null)cancelAnimationFrame(frame);frame=null;last=0;$('play').textContent='▶ Reproducir'}
function dist(a,b){const rad=Math.PI/180,dLat=(b.lat-a.lat)*rad,dLon=(b.lng-a.lng)*rad,x=Math.sin(dLat/2)**2+Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(dLon/2)**2;return 12742*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function color(v,t){return ms(v.llegada)<=t?'#16a34a':'#f59e0b'}
function draw(t){if(!datos.length)return;at=Math.max(start,Math.min(end,t));track.clearLayers();visitLayer.clearLayers();let path=[],pos=datos[0],cut=false;for(let i=0;i<datos.length;i++){const p=datos[i],tp=ms(p.fecha);if(i&&tp-ms(datos[i-1].fecha)>600000){if(path.length>1)L.polyline(path,{color:'#2563eb',weight:5}).addTo(track);path=[];if(at>ms(datos[i-1].fecha)&&at<tp)cut=true}if(tp>at){if(i&&!cut&&path.length){const prev=datos[i-1],f=(at-ms(prev.fecha))/(tp-ms(prev.fecha));pos={lat:prev.lat+(p.lat-prev.lat)*f,lng:prev.lng+(p.lng-prev.lng)*f};path.push([pos.lat,pos.lng])}break}pos=p;path.push([p.lat,p.lng])}if(path.length>1)L.polyline(path,{color:'#2563eb',weight:5}).addTo(track);marker.setLatLng([pos.lat,pos.lng]);
for(const v of visitas){const lat=Number(v.latitud),lng=Number(v.longitud);if(!Number.isFinite(lat)||!Number.isFinite(lng))continue;L.circleMarker([lat,lng],{radius:7,color:'#fff',weight:2,fillColor:color(v,at),fillOpacity:1}).bindPopup(esc(v.codigo_cliente+' · '+(v.nombre_cliente||'')+' · '+v.estado)).addTo(visitLayer)}
$('hora').textContent=dateFmt(at);$('barra').value=end>start?Math.round(1000*(at-start)/(end-start)):1000;$('reproEstado').textContent=cut?'⚠ Intervalo sin reporte GPS: se conserva la última posición':'Reproduciendo · '+Math.round(100*(at-start)/Math.max(1,end-start))+'%'}
function tick(ts){if(!playing)return;if(last)at+=Math.min(ts-last,250)*Number($('vel').value);last=ts;draw(at);if(at>=end){stop();$('reproEstado').textContent='Reproducción finalizada';return}frame=requestAnimationFrame(tick)}
function full(){stop();track.clearLayers();visitLayer.clearLayers();let segment=[],bounds=[];for(let i=0;i<datos.length;i++){const p=datos[i];if(i&&ms(p.fecha)-ms(datos[i-1].fecha)>600000){if(segment.length>1)L.polyline(segment,{color:'#2563eb',weight:5}).addTo(track);segment=[]}segment.push([p.lat,p.lng]);bounds.push([p.lat,p.lng])}if(segment.length>1)L.polyline(segment,{color:'#2563eb',weight:5}).addTo(track);for(const c of cortes)L.polyline([[c.a.lat,c.a.lng],[c.b.lat,c.b.lng]],{color:'#dc2626',dashArray:'8 8',weight:3}).bindPopup('Sin reporte GPS: '+Math.round(c.min/60)+' minutos').addTo(track);marker.setLatLng([datos[0].lat,datos[0].lng]);if(bounds.length)mapa.fitBounds(bounds,{padding:[30,30],maxZoom:16});$('reproEstado').textContent='Vista completa · Presioná Reproducir para animar'}
async function consultar(){stop();$('consultar').disabled=true;$('estado').textContent='Consultando...';try{const fecha=$('fecha').value,id=$('conductor').value;if(!fecha||!id)throw Error('Seleccioná fecha y conductor');const [raw,all]=await Promise.all([api('/gps?fecha='+encodeURIComponent(fecha)+'&conductor_id='+encodeURIComponent(id)),api('/visitas?fecha='+encodeURIComponent(fecha))]);datos=raw.map(p=>({lat:Number(p.latitud),lng:Number(p.longitud),fecha:p.fecha})).filter(p=>Number.isFinite(p.lat)&&Number.isFinite(p.lng)&&Number.isFinite(ms(p.fecha))).sort((a,b)=>ms(a.fecha)-ms(b.fecha));visitas=all.filter(v=>v.conductor_id===id);cortes=[];let km=0;for(let i=1;i<datos.length;i++){const a=datos[i-1],b=datos[i],gap=(ms(b.fecha)-ms(a.fecha))/1000;if(gap>600)cortes.push({a,b,min:gap});else if(gap>=0)km+=dist(a,b)}$('visitas').innerHTML=visitas.map(v=>'<tr><td>'+esc(dateFmt(v.llegada))+'</td><td>'+esc(v.codigo_cliente+' · '+(v.nombre_cliente||''))+'</td><td>'+esc(v.estado)+'</td><td>'+esc(Math.round(Number(v.permanencia_segundos||0)/60))+' min</td></tr>').join('')||'<tr><td colspan="4">Sin visitas registradas</td></tr>';$('resumen').innerHTML='<div class="stat">GPS: <b>'+datos.length+'</b> puntos</div><div class="stat">Visitas: <b>'+visitas.length+'</b></div><div class="stat">Interrupciones: <b>'+cortes.length+'</b></div><div class="stat">Distancia GPS aproximada: <b>'+km.toFixed(1)+' km</b></div>';if(!datos.length){$('estado').textContent='No hay posiciones GPS para la consulta.';return}start=ms(datos[0].fecha);end=ms(datos[datos.length-1].fecha);at=start;marker.setLatLng([datos[0].lat,datos[0].lng]);full();$('barra').value=0;$('hora').textContent=dateFmt(start);$('estado').textContent='Recorrido cargado: '+datos.length+' posiciones GPS.'}catch(e){$('estado').textContent=e.message}finally{$('consultar').disabled=false}}
async function init(){if(!token){location.href='index.html';return}try{const me=await api('/me');if(!['ADMIN','SUPERVISOR'].includes(me.rol))throw Error('Acceso restringido');$('empresa').textContent='Empresa: '+me.empresa+' · '+me.nombre+' '+me.apellido;const cs=await api('/conductores');$('conductor').innerHTML=cs.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.apellido+' '+c.nombre+' · '+c.legajo)+'</option>').join('');$('fecha').value=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Argentina/Buenos_Aires',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());mapa=L.map('mapa').setView([-34.65,-58.8],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(mapa);track=L.layerGroup().addTo(mapa);visitLayer=L.layerGroup().addTo(mapa);marker=L.circleMarker([-34.65,-58.8],{radius:10,color:'#fff',weight:3,fillColor:'#071b3a',fillOpacity:1}).addTo(mapa);$('consultar').onclick=consultar;$('play').onclick=()=>{if(!datos.length)return;if(playing){stop();$('reproEstado').textContent='En pausa';return}if(at>=end)at=start;playing=true;last=0;$('play').textContent='⏸ Pausar';frame=requestAnimationFrame(tick)};$('inicio').onclick=()=>{stop();draw(start)};$('barra').oninput=()=>{stop();draw(start+(end-start)*Number($('barra').value)/1000)};$('completo').onclick=full;await consultar()}catch(e){$('estado').textContent=e.message}}
init();
</script></body></html>
