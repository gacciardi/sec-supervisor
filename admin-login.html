<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEC · Administración</title><link rel="stylesheet" href="style.css"><style>main{max-width:560px;margin:28px auto;background:white;padding:24px;border-radius:14px}label{display:block;margin:14px 0}input{display:block;box-sizing:border-box;width:100%;padding:12px;font:inherit}button{padding:12px;font:inherit}#mensaje{white-space:pre-wrap}</style></head><body><header class="header-sec"><img src="assets/logo-rebesa.jpg" class="logo-rebesa" alt="Empresa"><div><h1>SEC · Administración</h1><p>Un mismo acceso para Comercial y Distribución</p></div></header><main><h2>Ingresar</h2><p>Usá el usuario y contraseña del Administrador Master global.</p><form id="ingreso-admin"><label>Empresa<input name="empresa" value="rebesa" autocomplete="organization" required></label><label>Usuario / legajo<input name="legajo" autocomplete="username" required maxlength="20"></label><label>Contraseña<input id="clave-admin" name="clave" type="password" autocomplete="current-password" required maxlength="128"></label><input name="master" type="hidden" value="SI"><button id="ver-clave" type="button" aria-pressed="false">Ver contraseña</button> <button type="submit">Ingresar</button></form><p id="mensaje" role="status"></p><p><a href="index.html">Volver a Comercial</a> · <a href="distribucion/index.html">Ir a Distribución</a></p></main><script>
const API_ADMIN='https://sec-backend-gg4j.onrender.com/distribucion';
document.querySelector('#ver-clave').onclick=()=>{const c=document.querySelector('#clave-admin'),visible=c.type==='password';c.type=visible?'text':'password';document.querySelector('#ver-clave').textContent=visible?'Ocultar contraseña':'Ver contraseña';document.querySelector('#ver-clave').setAttribute('aria-pressed',String(visible));};
document.querySelector('#ingreso-admin').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,b=f.querySelector('[type="submit"]'),m=document.querySelector('#mensaje');b.disabled=true;m.textContent='Verificando acceso…';try{const datos=Object.fromEntries(new FormData(f));datos.empresa=datos.empresa.trim().toLowerCase();datos.legajo=datos.legajo.trim();const r=await fetch(API_ADMIN+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(datos)}),d=await r.json();if(!r.ok)throw Error(d.error||'No se pudo ingresar');if(d.usuario?.rol!=='ADMIN'||!d.usuario.es_master){await fetch(API_ADMIN+'/logout',{method:'POST',headers:{Authorization:'Bearer '+d.token}});throw Error('Esta pantalla requiere el Administrador Master global.');}sessionStorage.setItem('sec-distribucion-token',d.token);sessionStorage.setItem('sec-master-global','1');sessionStorage.setItem('sec-master-empresa',d.usuario.empresa_id);localStorage.setItem('esAdmin','true');f.reset();location.href='administracion.html';}catch(error){m.textContent=error.message;b.disabled=false;}};
</script><script src="config-sec.js"></script></body></html>
