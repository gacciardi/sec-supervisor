<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEC - Distribución</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"><style>.menu-principal{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:25px}.menu-card{background:white;border-radius:18px;padding:25px;text-decoration:none;color:#111827;box-shadow:0 4px 14px rgba(0,0,0,.12);border:1px solid #e5e7eb;min-height:115px;display:block;cursor:pointer}.menu-card h3{margin:0 0 8px;color:#071b3a;font-size:22px}.menu-card p{margin:0;color:#4b5563;font-size:14px;line-height:1.45}button,input,select{padding:10px;margin:5px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}button{cursor:pointer}label{display:block}nav button{color:white;background:transparent;border:0}.panel{background:white;padding:20px;border-radius:15px;margin-top:15px;overflow:auto}#mensaje:not(:empty){padding:15px;background:#fff4df;white-space:pre-wrap;margin:15px 0}.acciones{display:flex;gap:8px;flex-wrap:wrap}#mapa{height:500px}.muted{color:#6b7280;font-size:14px}details{margin:15px 0} .conductor-acciones{display:flex;gap:5px;flex-wrap:wrap}.conductor-acciones .btn-maps{background:#0b55c7;color:white}.navegar-entrega{background:#0b55c7;color:white;margin-left:5px;padding:7px;border:0;border-radius:5px}
